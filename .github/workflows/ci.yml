name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Offline demo (in-process servers, no network)
        run: node dist/cli.js demo --no-color
      - name: Committed dist/ matches the sources
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "::error::dist/ is stale: run npm run build and commit it"; exit 1; }

  wire:
    name: Real HTTP against the reference server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start a compliant server and one that ignores Mcp-Name mismatches
        run: |
          node dist/cli.js serve --port 4100 --quiet &
          node dist/cli.js serve --port 4101 --quiet --fault name-header-unchecked &
          for port in 4100 4101; do
            for i in $(seq 1 50); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X GET "http://127.0.0.1:$port/mcp" || true)
              [ "$code" = "405" ] && break
              sleep 0.2
            done
          done
      - name: The compliant server scores 100
        run: node dist/cli.js check http://127.0.0.1:4100/mcp --no-color --min-score 100
      - name: The broken server fails exactly name-header-match
        run: |
          set +e
          node dist/cli.js check http://127.0.0.1:4101/mcp --json > report.json
          status=$?
          set -e
          test "$status" = "1"
          node -e 'const r = require("./report.json"); const f = r.rules.filter((x) => x.status === "fail").map((x) => x.id); console.log(f); if (f.join() !== "name-header-match") process.exit(1);'

  action:
    name: The GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start a compliant server and one without cache hints
        run: |
          node dist/cli.js serve --port 4200 --quiet &
          node dist/cli.js serve --port 4201 --quiet --fault no-cache-hints &
      - name: Passes the compliant server
        id: good
        uses: ./
        with:
          url: http://127.0.0.1:4200/mcp
          min-score: "100"
      - name: Fails the server without cache hints
        id: broken
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:4201/mcp
      - name: The outputs say so
        env:
          GOOD_SCORE: ${{ steps.good.outputs.score }}
          GOOD_CONFORMANT: ${{ steps.good.outputs.conformant }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_EXIT: ${{ steps.broken.outputs.exit-code }}
          BROKEN_SCORE: ${{ steps.broken.outputs.score }}
          BROKEN_FAILURES: ${{ steps.broken.outputs.failures }}
          REPORT: ${{ steps.broken.outputs.report }}
        run: |
          echo "good: score=$GOOD_SCORE conformant=$GOOD_CONFORMANT"
          echo "broken: outcome=$BROKEN_OUTCOME exit=$BROKEN_EXIT score=$BROKEN_SCORE failures=$BROKEN_FAILURES"
          test "$GOOD_SCORE" = "100" && test "$GOOD_CONFORMANT" = "true"
          test "$BROKEN_OUTCOME" = "failure" && test "$BROKEN_EXIT" = "1" && test "$BROKEN_FAILURES" = "1"
          node -e 'const r = require(process.argv[1]); const f = r.rules.find((x) => x.status === "fail"); console.log(f.id + ": " + f.message); if (f.id !== "cache-hints") process.exit(1);' "$REPORT"
